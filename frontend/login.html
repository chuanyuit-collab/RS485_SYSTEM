<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入 - 智慧管理平台</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        .login-container {
            max-width: 400px;
            margin: 10vh auto;
            text-align: center;
        }
        .login-container h2 {
            margin-bottom: 2rem;
            color: var(--text-primary);
        }
        .login-form {
            text-align: left;
        }
        .error-msg {
            color: #ef4444;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="app" class="container">
        <header>
            <h1>智慧管理平台</h1>
            <nav>
                <a href="/" class="nav-link">儀表板</a>
            </nav>
        </header>

        <main class="login-container card">
            <h2>管理員登入</h2>
            <div v-if="errorMsg" class="error-msg">{{ errorMsg }}</div>
            <div class="login-form">
                <div class="form-group">
                    <label>帳號</label>
                    <input type="text" v-model="username" @keyup.enter="login" placeholder="輸入帳號">
                </div>
                <div class="form-group">
                    <label>密碼</label>
                    <input type="password" v-model="password" @keyup.enter="login" placeholder="輸入密碼">
                </div>
                <button class="btn btn-primary" style="width: 100%; margin-top: 1rem;" @click="login" :disabled="loading">
                    {{ loading ? '登入中...' : '登入系統' }}
                </button>
            </div>
        </main>
    </div>

    <script>
        const { createApp, ref } = Vue;

        createApp({
            setup() {
                const username = ref('');
                const password = ref('');
                const loading = ref(false);
                const errorMsg = ref('');

                const login = async () => {
                    if (!username.value || !password.value) {
                        errorMsg.value = '請輸入帳號與密碼！';
                        return;
                    }
                    loading.value = true;
                    errorMsg.value = '';
                    
                    try {
                        const res = await fetch('/api/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ username: username.value, password: password.value })
                        });
                        const data = await res.json();
                        
                        if (res.ok && data.status === 'success') {
                            window.location.href = '/settings';
                        } else {
                            errorMsg.value = data.message || '登入失敗，請檢查帳號密碼';
                        }
                    } catch (e) {
                        errorMsg.value = '伺服器連線錯誤';
                    } finally {
                        loading.value = false;
                    }
                };

                return {
                    username, password, loading, errorMsg, login
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
